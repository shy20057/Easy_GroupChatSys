# Web\u670D\u52A1\u5668\u7AEF\u53E3
server.port=5050
# WebSocket\u7AEF\u53E3
ws.port=5051
server.servlet.context-path=/api
# Session\u8D85\u65F6\u65F6\u95F4\uFF0C60\u5206\u949F
server.servlet.session.timeout=PT60M
# \u914D\u7F6Efavicon
server.servlet.favicon.enabled=false
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB
# \u914D\u7F6E404
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# \u914D\u7F6E\u6570\u636E\u5E93
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/noshy_chat?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=qwer123456

spring.datasource.hikari.pool-name=HikariCPDataSource
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=180000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.connection-test-query=SELECT 1


# MyBatis-Plus MyBatis\u5730\u5740\u6620\u5C04
mybatis-plus.type-aliases-package=com.noshychat.entity
# Mapper xml \u8DEF\u5F84\u6620\u5C04 \u4EE5\u4E0B\u4E3A\u9ED8\u8BA4\u914D\u7F6E \u6545\u6CE8\u91CA
mybatis-plus.mapper-locations=classpath:mapper/*.xml
mybatis-plus.configuration.map-underscore-to-camel-case=true


# Spring redis\u914D\u7F6E
# Redis\u6570\u636E\u5E93\u7D22\u5F15\uFF08\u9ED8\u8BA4\u4E3A0\uFF09
spring.redis.database=0
spring.redis.host=127.0.0.1
spring.redis.port=6379
spring.redis.password=123456
# \u8FDE\u63A5\u6C60\u6700\u5927\u8FDE\u63A5\u6570\uFF08\u4F7F\u7528\u8D1F\u503C\u8868\u793A\u6CA1\u6709\u9650\u5236\uFF09
spring.redis.jedis.pool.max-active=20
# \u8FDE\u63A5\u6C60\u6700\u5927\u963B\u585E\u7B49\u5F85\u65F6\u95F4\uFF08\u4F7F\u7528\u8D1F\u503C\u8868\u793A\u6CA1\u6709\u9650\u5236\uFF09
spring.redis.jedis.pool.max-wait=-1
# \u8FDE\u63A5\u6C60\u4E2D\u7684\u6700\u5927\u7A7A\u95F2\u8FDE\u63A5
spring.redis.jedis.pool.max-idle=10
# \u8FDE\u63A5\u6C60\u4E2D\u7684\u6700\u5C0F\u7A7A\u95F2\u8FDE\u63A5
spring.redis.jedis.pool.min-idle=0
# \u8FDE\u63A5\u8D85\u65F6\u65F6\u95F4\uFF08\u6BEB\u79D2\uFF09
spring.redis.timeout=2000

# \u9879\u76EE\u76EE\u5F55
project.folder= C:/Users/s3324/.noshy-chat/

# \u65E5\u5FD7\u7EA7\u522B\u914D\u7F6E
log.root.level=info

# \u8D85\u7EA7\u7BA1\u7406\u5458\u90AE\u7BB1
admin.emails=shy123@qq.com

# \u662F\u5426\u662F\u5F00\u53D1\u73AF\u5883
dev=false

### Knife4j(Swagger)配置
knife4j.enable=true
knife4j.production=false
# Spring Boot 2.6+ 需要配置路径匹配策略为 ant_path_matcher
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

# OpenAPI\u6587\u6863
knife4j.openapi.title=\u7528\u6237\u7BA1\u7406\u63A5\u53E3\u6587\u6863
knife4j.openapi.description="\u7528\u6237\u7BA1\u7406\u63A5\u53E3\u6587\u6863"
knife4j.openapi.email=zhanghuyi@itcast.cn
knife4j.openapi.concat=\u864E\u54E5
knife4j.openapi.url=https://www.itcast.cn
knife4j.openapi.version=v1.0.0

# API\u5206\u7EC4
knife4j.openapi.group.default.group-name=default
knife4j.openapi.group.default.api-rule=package
knife4j.openapi.group.default.api-rule-resources[0]=com.noshychat.controller


